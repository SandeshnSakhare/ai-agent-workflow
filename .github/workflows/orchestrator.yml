name: Orchestrator

# Pipeline stages 1-3:
#   1. New issue -> validate + label + comment (orchestrator ack)
#   2. Approval gate -> job runs in the protected "dev-approval" environment;
#      GitHub notifies the required reviewers ("review pending"), and the
#      pipeline blocks until they approve. Rejection or timeout fails the run.
#   3. On approval -> assign the Copilot coding agent (developer agent) to the
#      issue via the REST agent-assignment API. The agent opens a DRAFT pull
#      request linked to the issue when it finishes.
#
# Stages 4-6 (unit-test agent, CI gate, review agent, auto-merge) live in
# pr-quality-gate.yml; deployment lives in deploy-dev.yml.

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: orchestrator-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage & acknowledge issue
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Validate issue
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          if [ -z "${TITLE// }" ]; then
            gh issue close "${{ github.event.issue.number }}" \
              --repo "${{ github.repository }}" \
              --reason "not planned" \
              --comment "Closed automatically: the issue has no title."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ${#BODY} -lt 20 ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "${{ github.repository }}" \
              --body "⚠️ This issue looks too sparse to act on. Please add a description (what, why, acceptance criteria), then close and reopen it to restart the pipeline."
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Label issue as agent-task
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "agent-task"

      - name: Post orchestrator acknowledgement
        if: steps.validate.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.issue.number;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: n,
              body: [
                `🤖 **Orchestrator** — task received (issue #${n}).`,
                ``,
                `Pipeline plan:`,
                `1. ⏳ **Approval gate** — waiting for a required reviewer of the \`dev-approval\` environment. GitHub has notified you ("review pending").`,
                `2. ▶️ On approval, the **developer agent** (Copilot coding agent) implements the task and opens a **draft pull request**.`,
                `3. 🧪 The **unit-test agent** then adds/updates unit tests on the PR (gated by the \`unittest-approval\` environment).`,
                `4. ✅ CI runs the unit-test suite; 🔍 the **review agent** (Copilot code review) reviews the changes.`,
                `5. 🔀 If everything is green, the PR **auto-merges** into \`main\`.`,
                `6. 🚀 The merge triggers the **deploy-to-dev** workflow.`,
                ``,
                `_Close this issue to cancel the run._`,
              ].join('\n'),
            });

  approval-gate:
    name: "Gate: human approval (dev-approval)"
    needs: triage
    if: needs.triage.outputs.valid == 'true'
    runs-on: ubuntu-latest
    # ⚠️ SETUP (one-time, Settings → Environments → dev-approval):
    #   - Add yourself (or a team) as "Required reviewers".
    # GitHub shows "Review pending" + sends a notification; the workflow
    # pauses here until a reviewer approves or rejects.
    environment: dev-approval
    steps:
      - name: Approval granted — continue pipeline
        run: |
          echo "Environment 'dev-approval' approved."
          echo "Continuing to developer-agent assignment."

  developer-agent:
    name: "Agent: developer (Copilot coding agent)"
    needs: approval-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.COPILOT_AGENT_PAT }}
    steps:
      - name: Assign Copilot coding agent to the issue
        env:
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -sfS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE}/assignees" \
            -d '{
              "assignees": ["copilot-swe-agent[bot]"],
              "agent_assignment": {
                "target_repo": "'"${REPO}"'",
                "base_branch": "main",
                "custom_instructions": "Implement this issue fully. Keep changes minimal and production-quality. Ensure the unit-test suite in tests/ still passes (npm test). When done, open a DRAFT pull request back to main that references Closes #'"${ISSUE}"'."
              }
            }'

      - name: Record hand-off on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "${ISSUE}" \
            --repo "${{ github.repository }}" \
            --body "👨‍💻 **Developer agent** assigned (Copilot coding agent). It will open a **draft PR** referencing this issue — the pipeline continues there automatically."

      - name: Fallback notice if assignment failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "❌ Could not assign the Copilot coding agent. Check that: (1) the `COPILOT_AGENT_PAT` secret is set (classic PAT with `repo` scope, or fine-grained with Metadata read + Actions/Contents/Issues/Pull requests read-write), (2) the PAT owner has a **paid Copilot plan**, (3) Copilot cloud agent is enabled for this repository.",
            });
