name: Orchestrator

# Pipeline stages 1-2:
#   1. New issue -> validate + label + comment (orchestrator ack)
#   2. Approval gate -> comment-based. The orchestrator stops after asking for
#      approval; posting `/approve` on the issue (approval-handler.yml)
#      assigns the Copilot coding agent (developer agent), which opens a
#      DRAFT pull request linked to the issue when it finishes.
#
# Why a comment gate instead of environment required-reviewers? On GitHub
# Free/Pro/Team plans, required reviewers are only enforced on PUBLIC repos,
# and repo admins bypass environment protections by default. A /approve
# comment works everywhere and is auditable in the issue thread.
#
# Stages 4-6 (unit-test agent, CI gate, review agent, auto-merge) live in
# pr-quality-gate.yml + approval-handler.yml; deployment in deploy-dev.yml.

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: orchestrator-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage & acknowledge issue
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Validate issue
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          if [ -z "${TITLE// }" ]; then
            gh issue close "${{ github.event.issue.number }}" \
              --repo "${{ github.repository }}" \
              --reason "not planned" \
              --comment "Closed automatically: the issue has no title."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ${#BODY} -lt 20 ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "${{ github.repository }}" \
              --body "⚠️ This issue looks too sparse to act on. Please add a description (what, why, acceptance criteria), then close and reopen it to restart the pipeline."
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Ensure 'agent-task' label exists
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create agent-task \
            --repo "${{ github.repository }}" \
            --color 1d76db \
            --description "Task queued for the multi-agent pipeline" \
            || echo "Label already exists."

      - name: Label issue as agent-task
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "agent-task"

      - name: Post orchestrator acknowledgement + approval request
        if: steps.validate.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.issue.number;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: n,
              body: [
                `🤖 **Orchestrator** — task received (issue #${n}).`,
                ``,
                `Pipeline plan:`,
                `1. ⏸ **Approval gate** — a maintainer must comment \`/approve\` on this issue to start work (or \`/deny\` to cancel).`,
                `2. ▶️ On approval, the **developer agent** (Copilot coding agent) implements the task and opens a **draft pull request**.`,
                `3. 🧪 A maintainer comments \`/approve-tests\` on the PR — the **unit-test agent** then adds/updates unit tests on the PR.`,
                `4. ✅ CI runs the unit-test suite; 🔍 the **review agent** (Copilot code review) reviews the changes.`,
                `5. 🔀 If everything is green, the PR **auto-merges** into \`main\`.`,
                `6. 🚀 The merge triggers the **deploy-to-dev** workflow.`,
                ``,
                `_Commands: \`/approve\` · \`/approve-tests\` (on the PR) · \`/deny\`. Closing this issue also cancels the run._`,
              ].join('\n'),
            });

  await-approval:
    name: "Gate: waiting for /approve comment"
    needs: triage
    if: needs.triage.outputs.valid == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline parked
        run: |
          echo "Triage complete. Pipeline is parked until a maintainer posts '/approve' on this issue."
          echo "The approval-handler.yml workflow will pick it up from the comment event."
