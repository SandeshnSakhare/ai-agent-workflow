name: PR Quality Gate

# Pipeline stages 4-6, driven by the pull request that the developer agent
# (Copilot coding agent) opens when it finishes an issue:
#
#   4. Unit-test agent  -> on the draft "opened" event only, a PR comment
#      "@copilot add unit tests ..." makes the same Copilot session extend
#      its PR with tests. Rejected approval => no comment => PR stays draft.
#   5. CI gate          -> on every later push (synchronize/ready_for_review):
#      the real unit-test suite must pass AND tests/ must actually change
#      before the pipeline may continue. This prevents merging an
#      implementation-only PR before the test agent has contributed.
#   6. Review agent     -> Copilot code review requested via REST API; once
#      it submits and checks are green, the PR is marked ready and
#      auto-merged (squash) into main; deploy-dev.yml then deploys to dev.
#
# Nothing external: everything runs inside GitHub Actions with the built-in
# GITHUB_TOKEN, plus Copilot features already included in your plan.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  unit-test-agent:
    name: "Agent: unit tests (@copilot)"
    # Opt-in native gate: only active if the repo variable ENABLE_ENV_GATES=1
    # is set AND the unittest-approval environment has required reviewers.
    # The DEFAULT unit-test path is the /approve-tests comment gate in
    # approval-handler.yml (works on all plans / private repos).
    # Runs on initial draft-open only, so agent pushes (synchronize) never
    # re-trigger it — no loops.
    if: github.event.action == 'opened' && github.event.pull_request.draft == true && vars.ENABLE_ENV_GATES == '1'
    runs-on: ubuntu-latest
    environment: unittest-approval
    steps:
      - name: Instruct the unit-test agent to extend the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "${PR}" \
            --repo "${{ github.repository }}" \
            --body "@copilot Great work on the implementation. Before this PR can be reviewed, extend this same pull request with unit tests: add/extend tests under tests/ for every behavior you added or changed in scripts/, keep them deterministic, cover edge cases and error paths, run npm test to confirm everything passes locally, and commit the tests to this PR. Do not modify application behavior while adding tests."

      - name: Acknowledge on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "${PR}" \
            --repo "${{ github.repository }}" \
            --body "🧪 **Unit-test agent** engaged — waiting for it to push tests to this PR."

  ci-gate:
    name: "CI: tests pass + tests were added"
    # Runs for every push after the draft opened (synchronize) and for PRs
    # opened ready. Deliberately not on 'opened' drafts — the test agent has
    # not pushed yet, so there is nothing to gate on except noise.
    if: github.event.action != 'opened'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.wait.outputs.passed }}
    steps:
      - id: wait
        name: Wait for the required 'tests' check on the PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api "repos/${REPO}/pulls/${PR}" --jq '.head.sha')"
          echo "Waiting for 'tests' check on ${HEAD_SHA}"
          for i in $(seq 1 60); do
            CONCLUSION="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
              --jq '.check_runs[] | select(.name == "tests") | .conclusion' | head -n1)"
            if [ "${CONCLUSION}" = "success" ]; then
              echo "Unit tests passed."
              echo "passed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${CONCLUSION}" = "failure" ]; then
              echo "::error::Unit tests failed on the PR head."
              exit 1
            fi
            echo "Check not concluded yet (attempt ${i}/60); sleeping 20s..."
            sleep 20
          done
          echo "::error::Timed out waiting for the 'tests' check to conclude."
          exit 1

      - name: Require that the PR actually changes tests/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TESTS_CHANGED="$(gh api "repos/${REPO}/pulls/${PR}/files?per_page=100" --paginate \
            --jq '[.[].filename] | any(startswith("tests/"))')"
          if [ "${TESTS_CHANGED}" != "true" ]; then
            echo "::error::This PR does not modify tests/ — the unit-test agent's contribution is required before the pipeline can continue."
            exit 1
          fi
          echo "Unit tests present in the PR diff."

  review-agent:
    name: "Agent: reviewer (GitHub Models free tier)"
    needs: ci-gate
    uses: ./.github/workflows/agent-runtime.yml
    with:
      mode: review
      pr_number: ${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      models: read

  auto-merge:
    name: Merge when green
    needs: review-agent
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready for review (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            || echo "PR already ready for review."

      - name: Enable auto-merge (squash), fall back to direct merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash --auto \
          || gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
          || echo "Merge skipped — PR is already merged or not in a mergeable state."

      - name: Note on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "${PR}" \
            --repo "${{ github.repository }}" \
            --body "🧪 Tests passed and 🔍 Copilot review submitted — PR marked ready and auto-merge (squash) enabled. It will merge as soon as branch protection allows; then deploy-dev.yml runs."
