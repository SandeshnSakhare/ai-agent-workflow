name: Agent Runtime

# Reusable coding-agent runtime with a PROVIDER FALLBACK CHAIN
# (issue #11 fix): GitHub Models → OpenRouter → Google Gemini.
#
# - Default provider (GitHub Models) always works: built-in GITHUB_TOKEN,
#   `models: read` permission, no secrets needed.
# - Optional fallbacks activate automatically when their secrets exist:
#     OPENROUTER_API_KEY  (https://openrouter.ai — free models, ~50 req/day)
#     GEMINI_API_KEY      (https://aistudio.google.com — free daily quota)
#   Get a key, add it as a repo secret, done. Missing key = provider skipped.
# - Failover triggers: provider outage (connection errors), empty model
#   responses, or an agent run producing no real file changes. Before
#   switching, the chain reverts the working tree so a half-finished
#   attempt never leaks into the next provider's run.
#
# Modes:
#   implement — read an issue, edit code on a branch, open a DRAFT PR
#   test      — check out the PR head, add unit tests, push to the PR
#   review    — post an LLM code review on the PR (non-blocking)
#
# Model ids (overridable via the `model` input for GitHub Models):
#   GH_MODEL      default: openai/gpt-4.1-mini
#   OR_MODEL      default: deepseek/deepseek-chat-v5:free
#   GEMINI_MODEL  default: gemini-2.0-flash

on:
  workflow_call:
    inputs:
      mode:
        description: "implement | test | review"
        required: true
        type: string
      issue_number:
        description: "Issue number (implement mode)"
        required: false
        type: string
      pr_number:
        description: "Pull request number (test/review modes)"
        required: false
        type: string
      model:
        description: "GitHub Models model id (vendor/model)"
        required: false
        type: string
        default: "openai/gpt-4.1-mini"

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  agent:
    name: "Agent: ${{ inputs.mode }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # used by litellm + probes
      GH_MODEL: ${{ inputs.model }}
      OR_MODEL: deepseek/deepseek-chat-v5:free
      GEMINI_MODEL: gemini-2.0-flash
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "ai-agent-workflow[bot]"
          git config user.email "agent@users.noreply.github.com"

      - name: Install aider
        run: python -m pip install --quiet aider-chat

      # ------------------------------------------------------------------
      # implement
      # ------------------------------------------------------------------
      - name: Read the issue
        if: inputs.mode == 'implement'
        id: issue
        run: |
          gh issue view "${{ inputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --json title,body \
            --jq '"title=" + .title' >> "$GITHUB_OUTPUT"
          gh issue view "${{ inputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --json body \
            --jq '.body' > /tmp/issue-body.md

      - name: Implement the issue (provider chain)
        if: inputs.mode == 'implement'
        run: |
          set -euo pipefail
          BRANCH="agent/implement-issue-${{ inputs.issue_number }}"
          git checkout -b "${BRANCH}"

          {
            echo "Title: ${{ steps.issue.outputs.title }}"
            echo "Body:"
            cat /tmp/issue-body.md
            echo
            echo "Rules: keep changes minimal and production-quality; unit"
            echo "tests in tests/ must keep passing (npm test); do not add"
            echo "dependencies."
          } > /tmp/agent-prompt.md

          bash scripts/agent-provider-chain.sh aider /tmp/agent-prompt.md

          git add -A
          git rm --cached -q .aider* 2>/dev/null || true
          git commit -m "feat: implement issue #${{ inputs.issue_number }} (developer agent)" \
            || { echo "::error::Agent produced no changes."; exit 1; }
          # Force-push: agent branches are ephemeral; re-runs after partial
          # failures stay idempotent.
          git push --force origin "${BRANCH}"

      - name: Open draft pull request
        if: inputs.mode == 'implement'
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "agent/implement-issue-${{ inputs.issue_number }}" \
            --draft \
            --title "feat: implement issue #${{ inputs.issue_number }} (developer agent)" \
            --body "Implements #${{ inputs.issue_number }}

          Produced by the **developer agent** (aider + provider fallback chain).

          **Next step:** a maintainer comments \`/approve-tests\` on this PR to
          engage the unit-test agent. Then CI + review + auto-merge run
          automatically."

      # ------------------------------------------------------------------
      # test
      # ------------------------------------------------------------------
      - name: Add tests to the PR (provider chain)
        if: inputs.mode == 'test'
        run: |
          set -euo pipefail
          BRANCH="$(gh pr view "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --json headRefName --jq .headRefName)"
          git checkout "${BRANCH}"

          {
            echo "Add or extend unit tests under tests/ for every behavior"
            echo "changed in this PR (git diff origin/main...HEAD). Use"
            echo "node:test and node:assert/strict; keep tests deterministic;"
            echo "cover edge cases and error paths; run npm test to confirm"
            echo "everything passes. Do NOT change application behavior."
          } > /tmp/agent-prompt.md

          bash scripts/agent-provider-chain.sh aider /tmp/agent-prompt.md

          git add -A
          git rm --cached -q .aider* 2>/dev/null || true
          git commit -m "test: add unit tests for PR #${{ inputs.pr_number }} (unit-test agent)" \
            || { echo "::error::Agent produced no test changes — the diff guard would reject this anyway."; exit 1; }
          git push --force origin "${BRANCH}"

      # ------------------------------------------------------------------
      # review
      # ------------------------------------------------------------------
      - name: Fetch PR diff
        if: inputs.mode == 'review'
        run: |
          gh pr diff "${{ inputs.pr_number }}" --repo "${{ github.repository }}" > /tmp/pr.diff
          head -c 60000 /tmp/pr.diff > /tmp/pr.trunc.diff

      - name: Generate review (provider chain)
        if: inputs.mode == 'review'
        id: review
        run: |
          set +e
          REVIEW="$(bash scripts/agent-provider-chain.sh review /tmp/pr.trunc.diff)"
          RC=$?
          set -e
          if [ ${RC} -ne 0 ] || [ -z "${REVIEW}" ]; then
            REVIEW="Review unavailable (all providers failed or rate-limited) — check the Actions logs."
          fi
          # Multiline-safe export
          {
            echo "REVIEW<<EOF_REVIEW"
            echo "${REVIEW}"
            echo "EOF_REVIEW"
          } >> "$GITHUB_ENV"

      - name: Post the review on the PR
        if: inputs.mode == 'review'
        env:
          PR: ${{ inputs.pr_number }}
        run: |
          gh pr review "${PR}" \
            --repo "${{ github.repository }}" \
            --comment \
            --body "🔍 **Review agent** (aider + provider fallback chain):

          ${REVIEW}"
