name: CI

# Runs the unit-test suite on every PR and on main.
# The job key/name "tests" is deliberate: it produces a check-run named
# "tests", which pr-quality-gate.yml (ci-gate job) waits for, and which
# scripts/setup-github.sh sets as a required status check on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests
        run: npm test
