<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator — Multi-Agent Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Calculator</h1>
    <p class="subtitle">Demo app for the GitHub-native multi-agent workflow</p>

    <form id="calc-form">
      <input id="a" type="number" step="any" placeholder="First number" required />
      <select id="op" aria-label="Operation">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>
      <input id="b" type="number" step="any" placeholder="Second number" required />
      <button type="submit">=</button>
    </form>

    <div id="result" class="result" aria-live="polite">—</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
